<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Arcade</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding-inline: 16px;
      padding-block: 48px;
      background: #1a1814;
      color: #efe8da;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 24px; }
    h1 { margin: 0; font-size: 32px; letter-spacing: 0.02em; }
    p { margin: 0; color: #cfc8bb; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    a.game {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease;
    }
    a.game:hover { transform: translateY(-3px); }
    a.game:focus-visible { outline: 3px solid #efe8da; outline-offset: 3px; }
    a.game strong { font-size: 22px; }
    a.game span { font-size: 14px; opacity: 0.85; }
    .flap { background: #70c5ce; color: #2d2a26; }
    .crumbs { background: #1d3470; color: #f5ead2; box-shadow: inset 0 0 0 2px #d9aa4f; }
    .crumbs strong { color: #d9aa4f; }
    @media (prefers-reduced-motion: reduce) { a.game { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Tiny Arcade</h1>
    <p>Pick a game.</p>
    <div class="games">
      <a class="game flap" href="tiny-flap/">
        <strong>Tiny Flap</strong>
        <span>Tap to flap between the pipes.</span>
      </a>
      <a class="game crumbs" href="cookie-clicker/">
        <strong>Tiny Crumbs</strong>
        <span>A cookie clicker with helpers, upgrades and rebirths.</span>
      </a>
    </div>
  </main>
</body>
</html>
